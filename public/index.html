<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0f" />
  <title>家庭車機中心</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="display-shell">
    <header>
      <div>
        <div class="eyebrow">FAMILY DRIVE</div>
        <h1>我們家</h1>
      </div>
      <div id="clock" class="clock">--:--</div>
    </header>

    <section id="preview" class="preview hidden">本機預覽模式 · 部署到 Cloudflare 後會自動連接 LINE 家庭提醒</section>
    <section id="offline" class="offline hidden">目前離線，恢復網路後會自動同步</section>
    <section id="setup" class="setup hidden">
      <h2>第一次設定</h2>
      <p>請在網址後加入 <code>?key=你的DASHBOARD_KEY</code> 開啟一次。成功後金鑰會儲存在這台瀏覽器，網址會自動清除。</p>
    </section>

    <section id="hero" class="hero">
      <div class="empty-icon">🏠</div>
      <h2>目前沒有新的家庭提醒</h2>
      <p>家人在 LINE 傳「車車 訊息」後，會自動顯示在這裡。</p>
    </section>

    <section id="tasks" class="tasks" aria-live="polite"></section>
    <footer>行車顯示模式 · 僅供查看 · 請勿於行駛中操作螢幕</footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
